name: Deno

on:
  push:
    branches: [gh-pages]
  pull_request:
    branches: [gh-pages]
  schedule:
    - cron: "0 2 * * 1-5"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2.3.2

      - name: HTML5 Validator
        uses: Cyb3r-Jak3/html5validator-action@v0.6.1
        with:
          root: ./
          log_level: INFO
          blacklist: npm_modules google3b93de3569df4ebd.html googled98412e986f33743.html 

      - uses: actions/upload-artifact@v4
        with:
          name: log
          path: log.log

  # 3. Build and deploy to GitHub Pages
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2.3.2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Ensure CNAME for custom domain
        run: echo "liguo.jiao.co.nz" > ./CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          cname: liguo.jiao.co.nz

  # 4. Check for broken links and images
  link-and-image-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2.3.2

      - name: Check links and images
        uses: lycheeverse/lychee-action@v1.10.0
        with:
          args: --verbose --no-progress --exclude-mail './**/*.html'

  # 5. Check SEO best practices
  seo-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2.3.2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Start static server
        run: |
          npx serve . -l 8080 &
          sleep 2

      - name: Run Lighthouse SEO check
        run: |
          npx lhci autorun --collect.url="http://localhost:8080" --collect.staticDistDir=./ --upload.target=filesystem --upload.outputDir=./lhci-report

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lhci-report
          path: lhci-report
